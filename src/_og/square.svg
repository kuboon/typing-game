<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <rect width="800" height="800" fill="#f5f5dc"/>
  <rect x="20" y="20" width="760" height="760" rx="28" fill="#ffffff" stroke="#ff00ff" stroke-width="8"/>
  <image href="https://typing.kbn.one/img/typistan.jpg" x="330" y="420" width="446" height="345" preserveAspectRatio="xMaxYMax meet"/>
  <g font-family="M PLUS Rounded 1c" font-weight="800" text-anchor="middle">
